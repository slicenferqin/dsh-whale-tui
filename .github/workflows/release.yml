name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-native:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 (Intel) runner 排队动辄半小时起，darwin-x64 改在
          # macos-14 上交叉编译；代价是该平台不跑测试（无法执行 x86
          # 二进制），由另外两个平台的测试套件覆盖。
          - { os: macos-14, platform: darwin, arch: arm64, target: darwin-arm64, rust_target: aarch64-apple-darwin, native: true }
          - { os: macos-14, platform: darwin, arch: x64, target: darwin-x64, rust_target: x86_64-apple-darwin, native: false }
          - { os: ubuntu-24.04, platform: linux, arch: x64, target: linux-x64, rust_target: x86_64-unknown-linux-gnu, native: true }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
      - run: rustup update stable && rustup default stable
      - run: rustup target add ${{ matrix.rust_target }}
      # 能执行的目标平台跑完整测试套件，这就是该平台的验证。
      - run: cargo test --locked
        if: matrix.native
      - run: cargo build --release --locked --target ${{ matrix.rust_target }}
      - name: Stage native binary
        run: >
          node scripts/package-native.mjs stage
          --source target/${{ matrix.rust_target }}/release/dsh-whale-tui
          --platform ${{ matrix.platform }}
          --arch ${{ matrix.arch }}
          --vendor-root vendor
      - uses: actions/upload-artifact@v4
        with:
          name: vendor-${{ matrix.target }}
          path: vendor/${{ matrix.target }}/dsh-whale-tui
          if-no-files-found: error

  package:
    name: Pack npm bundle
    needs: build-native
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Tag must match npm package version
        run: |
          pkg="$(node -p "require('./npm/package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          [ "$pkg" = "$tag" ] || { echo "version mismatch: package.json=$pkg tag=$tag"; exit 1; }
      - uses: actions/download-artifact@v4
        with:
          pattern: vendor-*
          path: vendor-tmp
      # artifact 不保留可执行位，逐个落位后补回。
      - name: Assemble vendor tree
        run: |
          set -euo pipefail
          mkdir -p npm/vendor
          for d in vendor-tmp/vendor-*; do
            target="${d##*/vendor-}"
            mkdir -p "npm/vendor/$target"
            cp "$d/dsh-whale-tui" "npm/vendor/$target/"
            chmod +x "npm/vendor/$target/dsh-whale-tui"
          done
      - run: node scripts/package-native.mjs verify --vendor-root npm/vendor
      - run: node --check npm/lib/index.js && node --check npm/bin/dsh-whale-tui.js
      # 用 linux 二进制做一次无 TTY 冒烟，证明产物可执行。
      - run: npm/vendor/linux-x64/dsh-whale-tui --dump-frame 80x24 > /dev/null
      - name: npm pack
        run: |
          mkdir -p dist
          cd npm && npm pack --pack-destination ../dist
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tgz
          path: dist/*.tgz
          if-no-files-found: error
      - name: GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tgz --generate-notes

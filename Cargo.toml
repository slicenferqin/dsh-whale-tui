[package]
name = "dsh-whale-tui"
version = "0.1.0"
edition = "2021"
description = "grok-style terminal UI for DeepSeek Harness (skeleton)"
license = "MIT"

[[bin]]
name = "dsh-whale-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true

[package]
name = "dsh-whale-tui"
version = "0.1.41"
edition = "2021"
description = "grok-style terminal UI for DeepSeek Harness"
license = "MIT"

[[bin]]
name = "dsh-whale-tui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-width = "0.2"
pulldown-cmark = "0.13"
# Tokenizer only: we map Sublime scopes onto our own theme slots, so no
# tmTheme assets ship and the palette stays under `src/theme.rs`. fancy-regex
# keeps this pure Rust for the cross-compiled npm binaries.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "regex-fancy",
    "default-syntaxes",
] }
ruzstd = "0.8"
base64 = "0.22"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
strip = true
